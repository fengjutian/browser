[package]
name = "ai-knowledge-browser"
version = "0.1.0"
description = "AI-powered desktop knowledge browser"
edition = "2021"

[lib]
name = "ai_knowledge_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable", "image-png"] }
tauri-plugin-dialog = "2"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "rt", "macros", "fs", "io-util"] }
async-trait = "0.1"
thiserror = "1"

[target.x86_64-pc-windows-msvc.dependencies]
webview2-com = "0.39.1"
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation"] }
