[package]
name = "ai-knowledge-browser"
version = "0.1.0"
description = "AI-powered desktop knowledge browser"
edition = "2021"

[lib]
name = "ai_knowledge_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
url = "2"
